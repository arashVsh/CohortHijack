experiment_name: search_v2_smoke
run_label: search_v2_smoke
output_dir: outputs/search_v2_smoke
seeds: [13]
datasets: [paul15]
classifiers: [logreg]
test_size: 0.35
min_class_cells: 30
max_cells_per_class: 150
n_hvg: 500
n_pcs: 20
refinement:
  k: 10
  self_weight: 1.0
  neighbor_weight: 1.0
  confidence_weighted: true
audit:
  n_targets_per_run: 3
  target_policy: vulnerable
  enabled: [multistart_greedy, beam]
  budgets: []
  random_repeats: 0
  candidate_pool_size: 24
  greedy_group_size: 3
  max_greedy_steps: 4
  max_removed_fraction: 0.05
  multistart_restarts: 3
  beam_width: 2
  beam_branching_factor: 4
  collateral_sample_size: 100
runtime:
  resume: true
  n_jobs: -1
  save_models: false
