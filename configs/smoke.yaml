experiment_name: smoke
output_dir: outputs/smoke
seeds: [13]
datasets: [pbmc3k, paul15]
classifiers: [logreg, linear_svm]
test_size: 0.35
min_class_cells: 25
max_cells_per_class: 180
n_hvg: 800
n_pcs: 25
refinement:
  k: 15
  self_weight: 1.0
  neighbor_weight: 1.0
  confidence_weighted: true
audit:
  n_targets_per_run: 12
  target_policy: vulnerable
  random_repeats: 3
  budgets: [0.01, 0.03, 0.05]
  candidate_pool_size: 40
  greedy_group_size: 2
  max_greedy_steps: 5
  collateral_sample_size: 150
runtime:
  resume: true
  n_jobs: 1
  save_models: false
