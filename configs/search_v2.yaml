experiment_name: search_v2_paul15
run_label: search_v2_paul15
output_dir: outputs/search_v2
seeds: [13, 37, 73]
datasets: [paul15]
classifiers: [logreg, linear_svm]
test_size: 0.35
min_class_cells: 30
max_cells_per_class: 500
n_hvg: 1500
n_pcs: 40
refinement:
  k: 25
  self_weight: 1.0
  neighbor_weight: 1.0
  confidence_weighted: true
audit:
  n_targets_per_run: 100
  target_manifest_root: outputs/iccke
  target_policy: vulnerable
  enabled: [multistart_greedy, beam]
  budgets: []
  random_repeats: 0
  candidate_pool_size: 120
  greedy_group_size: 3
  max_greedy_steps: 16
  max_removed_fraction: 0.05
  multistart_restarts: 8
  beam_width: 4
  beam_branching_factor: 10
  collateral_sample_size: 500
runtime:
  resume: true
  n_jobs: -1
  save_models: false
