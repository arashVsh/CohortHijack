output_root: outputs/ablations
base:
  experiment_name: ablation
  run_label: ablation
  seeds: [13, 37, 73]
  datasets: [pbmc3k, paul15]
  classifiers: [logreg, linear_svm]
  test_size: 0.35
  min_class_cells: 30
  max_cells_per_class: 500
  n_hvg: 1500
  n_pcs: 40
  refinement:
    k: 25
    self_weight: 1.0
    neighbor_weight: 1.0
    confidence_weighted: true
  audit:
    n_targets_per_run: 50
    target_manifest_root: outputs/iccke
    target_policy: vulnerable
    enabled: [random, same_class, nearest]
    random_repeats: 3
    budgets: [0.01, 0.05, 0.10]
    candidate_pool_size: 120
    greedy_group_size: 3
    max_greedy_steps: 15
    collateral_sample_size: 500
  runtime:
    resume: true
    n_jobs: -1
    save_models: false
variants:
  - name: refine_k10
    overrides:
      refinement:
        k: 10
  - name: refine_k50
    overrides:
      refinement:
        k: 50
  - name: context_weight_0
    overrides:
      refinement:
        neighbor_weight: 0.0
  - name: context_weight_0p5
    overrides:
      refinement:
        neighbor_weight: 0.5
  - name: context_weight_2
    overrides:
      refinement:
        neighbor_weight: 2.0
  - name: unweighted_neighbors
    overrides:
      refinement:
        confidence_weighted: false
  - name: search_pool60
    overrides:
      datasets: [paul15]
      audit:
        n_targets_per_run: 50
        enabled: [greedy]
        budgets: []
        random_repeats: 0
        candidate_pool_size: 60
        greedy_group_size: 3
        max_greedy_steps: 20
        max_removed_fraction: 0.05
  - name: search_group5
    overrides:
      datasets: [paul15]
      audit:
        n_targets_per_run: 50
        enabled: [greedy]
        budgets: []
        random_repeats: 0
        candidate_pool_size: 120
        greedy_group_size: 5
        max_greedy_steps: 20
        max_removed_fraction: 0.05
